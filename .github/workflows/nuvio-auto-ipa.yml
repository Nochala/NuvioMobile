name: Auto Build Latest Nuvio IPA

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Build even if upstream has not changed
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - cmp-rewrite
    paths:
      - '.github/workflows/nuvio-auto-ipa.yml'

permissions:
  contents: write

concurrency:
  group: nuvio-auto-ios-ipa
  cancel-in-progress: false

jobs:
  check:
    name: Check upstream Nuvio revision
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check out builder repository
        uses: actions/checkout@v6
        with:
          ref: cmp-rewrite

      - name: Compare with last successful build
        id: check
        shell: bash
        run: |
          set -euo pipefail

          upstream_sha="$(git ls-remote https://github.com/NuvioMedia/NuvioMobile.git refs/heads/cmp-rewrite | awk '{print $1}')"
          if [[ -z "${upstream_sha}" ]]; then
            echo "Unable to resolve NuvioMedia/NuvioMobile cmp-rewrite." >&2
            exit 1
          fi

          short_sha="${upstream_sha:0:12}"
          last_sha=""
          if [[ -f .github/nuvio-last-built-sha ]]; then
            last_sha="$(tr -d '[:space:]' < .github/nuvio-last-built-sha)"
          fi

          should_build=false
          if [[ "${upstream_sha}" != "${last_sha}" ]]; then
            should_build=true
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_build }}" == "true" ]]; then
            should_build=true
          fi

          echo "Upstream SHA: ${upstream_sha}"
          echo "Last built SHA: ${last_sha:-<none>}"
          echo "Build required: ${should_build}"

          echo "upstream_sha=${upstream_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "should_build=${should_build}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build unsigned Release IPA
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: Release
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M

    steps:
      - name: Check out latest upstream Nuvio source
        uses: actions/checkout@v6
        with:
          repository: NuvioMedia/NuvioMobile
          ref: ${{ needs.check.outputs.upstream_sha }}
          path: source

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('source/gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        working-directory: source
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Prepare iOS dependencies
        working-directory: source
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned full Release IPA
        working-directory: source
        run: ./scripts/build-ios-ipa.sh

      - name: Verify IPA output
        id: ipa
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name '*-full-release.ipa' -print -quit)"
          if [[ -z "${ipa_path}" ]]; then
            echo "No Release IPA was produced." >&2
            exit 1
          fi
          echo "ipa_path=${ipa_path}" >> "${GITHUB_OUTPUT}"
          echo "Created $(basename "${ipa_path}")"
          shasum -a 256 "${ipa_path}"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-ios-release-${{ needs.check.outputs.short_sha }}
          path: source/build/ios-ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        working-directory: source
        shell: bash
        run: |
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name '*-full-release.ipa' -print -quit)"
          {
            echo '## Nuvio iOS IPA ready'
            echo
            echo "- Upstream commit: \`${{ needs.check.outputs.upstream_sha }}\`"
            echo "- File: \`$(basename "${ipa_path}")\`"
            echo "- Size: $(du -h "${ipa_path}" | cut -f1)"
            echo '- Signing: unsigned (ready for Sideloadly)'
            echo '- Artifact retention: 14 days'
          } >> "${GITHUB_STEP_SUMMARY}"

  record:
    name: Record successful upstream build
    needs:
      - check
      - build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out builder repository
        uses: actions/checkout@v6
        with:
          ref: cmp-rewrite

      - name: Save last successfully built upstream SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          printf '%s\n' '${{ needs.check.outputs.upstream_sha }}' > .github/nuvio-last-built-sha

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/nuvio-last-built-sha

          if git diff --cached --quiet; then
            echo 'Build marker is already current.'
            exit 0
          fi

          git commit -m 'Update last built Nuvio upstream revision'
          git push origin HEAD:cmp-rewrite
